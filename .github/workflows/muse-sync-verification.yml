name: Muse synchronization verification

on:
  push:
    branches: [development/muse-verified-sync-2026-10-24]
  pull_request:
    branches: [development/first-boot-desktop]
    paths:
      - tests/desktop-supervisor.py
      - tests/state-mount-safety.py
      - src/veil-core/src/audit.rs
      - src/veil-core/tests/audit.rs
      - src/veil-core/src/credential.rs
      - .github/workflows/muse-sync-verification.yml

permissions:
  contents: read

concurrency:
  group: muse-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-transfers:
    if: github.event_name == 'push' || github.head_ref == 'development/muse-verified-sync-2026-10-24'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install the existing pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.99.0
      - name: Install regular-file storage validation tools
        run: sudo apt-get update && sudo apt-get install -y gdisk gawk dosfstools mtools e2fsprogs
      - name: Verify transferred GPT discovery and real image files
        run: python3 tests/muse-storage-transfer.py
      - name: Verify transferred writer and USB/VGA harness
        run: |
          bash -n tools/write-test-media.sh build/scripts/qemu.sh
          python3 -m py_compile tests/smoke-native-joined-hardware.py
          python3 tests/write-test-media.py
          python3 tests/qemu-options.py
      - name: Verify formatting and Clippy
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify transferred fixtures and workspace under all three umasks
        run: |
          for mask in 0007 0022 0077; do
            (
              umask "$mask"
              echo "Verifying transferred fixtures and Rust tests under umask $mask"
              python3 tests/desktop-supervisor.py
              python3 tests/state-mount-safety.py
              cargo test --workspace --all-targets --locked
            )
          done
          git diff --exit-code -- Cargo.lock
      - name: Run complete existing host tier including QEMU command fixtures
        run: bash build.sh offline-check --level host --timeout 180

  muse-candidate-host:
    name: Review pinned Muse candidate without importing guest code
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          repository: magicmantheace/shiny-dollop
          ref: b49ed0dd3a5be70854a63e546cd35d6a579b0340
          path: muse-candidate
          persist-credentials: false
      - name: Install existing pinned toolchain and GUI build prerequisites
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          sudo apt-get update
          sudo apt-get install -y gdisk gawk dosfstools mtools e2fsprogs weston libwayland-dev meson ninja-build libexpat1-dev libffi-dev pkg-config gcc
      - name: Verify candidate Rust formatting, Clippy and workspace tests
        working-directory: muse-candidate/projects/synveil
        run: |
          rustup override set 1.99.0
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
      - name: Verify candidate host transaction and release interoperability tests
        working-directory: muse-candidate/projects/synveil
        run: |
          python3 tests/ab-update.py
          python3 tests/ab-release-crosscheck.py
          python3 -m py_compile tests/smoke-native-ab.py tests/smoke-native-ab-gui.py tools/native_ab.py
      - name: Compile candidate graphical updater against source-pinned protocol
        working-directory: muse-candidate/projects/synveil
        run: |
          python3 tools/native_xdg_shell.py --generate
          gcc -std=c11 -Wall -Wextra -Werror -Iout/native-xdg-shell/generated \
            src/desktop-wayland/update-window.c \
            out/native-xdg-shell/generated/xdg-shell-code.c \
            $(pkg-config --cflags --libs wayland-client) -o out/synveil-update-gui
      - name: Run candidate complete existing host tier
        working-directory: muse-candidate/projects/synveil
        run: bash build.sh offline-check --level host --timeout 180
      - name: Retain candidate host receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: muse-candidate-host-b49ed0d
          if-no-files-found: ignore
          retention-days: 7
          path: muse-candidate/projects/synveil/out/local-validation/*/results.json
