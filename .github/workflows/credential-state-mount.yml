name: Native credential mount regression

on:
  push:
    branches:
      - development/first-boot-desktop
    paths:
      - src/veil-core/src/credential.rs
      - src/veil-core/tests/enrollment.rs
      - src/veil-display/enroll.c
      - src/veil-display/enroll.h
      - tests/display-enroll.c
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/credential-state-mount.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Use pinned Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup override set 1.99.0
      - name: Run credential verifier and enrollment tests
        run: |
          cargo test --locked -p veil-core --lib credential::tests::
          cargo test --locked -p veil-core --test enrollment
          git diff --exit-code -- Cargo.lock
      - name: Build and run real graphical first-user gate unit tests
        run: |
          gcc -O2 -std=c11 -Wall -Wextra -Werror \
            -I src/veil-display \
            tests/display-enroll.c src/veil-display/enroll.c \
            -o /tmp/synveil-display-enroll-state-check
          /tmp/synveil-display-enroll-state-check
