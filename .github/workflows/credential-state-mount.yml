name: Native credential state mount safety

on:
  push:
    branches: [development/first-boot-desktop]
    paths:
      - src/veil-core/src/credential.rs
      - src/veil-core/tests/enrollment.rs
      - src/veil-core/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/credential-state-mount.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier-and-enrollment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Install project-pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup override set 1.99.0

      - name: Run real Argon2id verifier and mount-identity unit tests
        run: cargo test --locked -p veil-core --lib credential::tests:: -- --nocapture

      - name: Run real one-shot enrollment and denied-secret integration tests
        run: cargo test --locked -p veil-core --test enrollment -- --nocapture

      - name: Verify lockfile is unchanged
        run: git diff --exit-code -- Cargo.lock

      - name: Require fixed VM state mount in both credential and display code
        run: |
          grep -F 'const VM_STATE_DEVICE: &str = "/dev/vdb"' src/veil-core/src/credential.rs
          grep -F 'strcmp(source, "/dev/vdb")' src/veil-display/enroll.c
          grep -F 'state=/dev/vdb' build/rootfs/mount-state
          echo 'NATIVE_CREDENTIAL_STATE_PIN_TESTED'
