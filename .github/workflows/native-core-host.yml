name: Native core host checks

on:
  push:
    branches:
      - phase2/native-core-bootstrap
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - VERSION
      - src/**
      - build.sh
      - build/manifests/rust-bootstrap.json
      - tools/native_preflight.py
      - tools/native_build.py
      - tools/native_rustc_wrapper.py
      - tests/native-preflight.py
      - tests/native-build.py
      - .github/workflows/native-core-host.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-core-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out Synveil
        uses: actions/checkout@v6

      - name: Test native build prerequisite checks
        run: |
          python3 tests/native-preflight.py
          python3 tests/native-build.py

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup override set 1.99.0
          rustc --version --verbose
          cargo --version

      - name: Show committed dependency lock
        run: |
          test -f Cargo.lock
          echo "----- BEGIN CARGO LOCK -----"
          cat Cargo.lock
          echo "----- END CARGO LOCK -----"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test workspace
        run: cargo test --workspace --all-targets --locked

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Preserve generated lock
        uses: actions/upload-artifact@v4
        with:
          name: native-core-cargo-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 7
