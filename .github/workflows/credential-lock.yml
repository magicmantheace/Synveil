name: Resolve pinned credential dependency lock

on:
  push:
    branches: [phase2/native-core-bootstrap]
    paths:
      - Cargo.toml
      - src/veil-core/Cargo.toml
      - .github/workflows/credential-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned host Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --no-self-update
          rustup override set 1.99.0
      - name: Resolve dependency lock without altering repository
        run: |
          cargo generate-lockfile
          printf '%s\n' SYNVEIL_CARGO_LOCK_BEGIN
          cat Cargo.lock
          printf '%s\n' SYNVEIL_CARGO_LOCK_END
