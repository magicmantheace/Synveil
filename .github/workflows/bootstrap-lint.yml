name: Bootstrap lint

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - build.sh
      - Makefile
      - build/**
      - tools/**
      - tests/**
      - .github/workflows/bootstrap-lint.yml
  pull_request:
    paths:
      - VERSION
      - build.sh
      - Makefile
      - build/**
      - tools/**
      - tests/**
      - .github/workflows/bootstrap-lint.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Synveil
        uses: actions/checkout@v6
      - name: Validate bootstrap sources
        run: bash build.sh lint
